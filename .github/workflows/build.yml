# Builds and tests on Linux, macOS and Windows. OCCT comes from conda-forge so every platform gets the same 7.8+.
name: build
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: occt
          create-args: occt=7.9
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Window libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Point the build at OCCT
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then root="$CONDA_PREFIX/Library"; echo "$root/bin" >> "$GITHUB_PATH"; else root="$CONDA_PREFIX"; fi
          echo "OCCT_INCLUDE_DIR=$root/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$root/lib" >> "$GITHUB_ENV"
          # Tests load OCCT at run time too.
          [ "$RUNNER_OS" = "Linux" ] && echo "LD_LIBRARY_PATH=$root/lib" >> "$GITHUB_ENV"
          [ "$RUNNER_OS" = "macOS" ] && echo "DYLD_FALLBACK_LIBRARY_PATH=$root/lib" >> "$GITHUB_ENV"
          true
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace -- -D warnings
        if: runner.os == 'Linux'
      - name: Repository rules (assets attributed, crates layered)
        if: runner.os == 'Linux'
        run: cargo xtask assets && cargo xtask layers
      - run: cargo build --workspace
      - run: cargo test --workspace
      # The plugins (plugins/): built for WebAssembly, packaged, and run end to end in the plugin host.
      - name: Plugins
        if: runner.os == 'Linux'
        run: (cd plugins && cargo fmt --all --check && cargo clippy --release -- -D warnings) && cargo xtask plugin test

  # The swappable core: with no OCCT installed at all, the engine, the pure-Rust kernel and the CLI still build,
  # test and model (crates/kernel-rs/smoke.jsonl: sketch, extrude, move, measure).
  rust-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p shapecraft-kernel-rs -p shapecraft-kernels --no-default-features
      - run: cargo build -p shapecraft-cli --no-default-features
      - name: Model on the Rust kernel
        run: |
          out=$(./target/debug/shapecraft-cli run crates/kernel-rs/smoke.jsonl --kernel rust)
          echo "$out"
          echo "$out" | grep -q '"volume_mm3":1000.0'
