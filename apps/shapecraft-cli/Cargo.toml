[package]
name = "shapecraft-cli"
description = "Command-line tools for ShapeCraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["occt"]
# Without it the CLI builds from Rust alone and runs on the pure-Rust kernel.
occt = ["shapecraft-kernels/occt"]

[dependencies]
shapecraft-kernel.workspace = true
shapecraft-kernels.workspace = true
anyhow.workspace = true
shapecraft-doc.workspace = true
shapecraft-engine.workspace = true
shapecraft-render.workspace = true
serde_json.workspace = true
png = "0.18"
shapecraft-mcp.workspace = true

[lints]
workspace = true
