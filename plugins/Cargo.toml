# ShapeCraft's plugins: their own workspace, built for WebAssembly (`cargo xtask plugin build`), not with the app.
[workspace]
resolver = "3"
members = ["sdk", "official/*", "community/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shapecraft-plugin = { path = "sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"
